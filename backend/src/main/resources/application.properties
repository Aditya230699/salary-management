# Application
spring.application.name=salary-management
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/salarydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGenerationThatIsLongEnoughForHS256Algorithm2024
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# Pagination defaults
app.pagination.default-page-size=20
app.pagination.max-page-size=100
