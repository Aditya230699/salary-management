# Application
spring.application.name=salary-management
server.port=${PORT:8080}

# Fast in-memory H2 Database for ephemeral cloud deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:salarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# H2 Web Console
spring.h2.console.enabled=false
app.security.h2-console-exposed=false

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-outside-local-development-2024}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Pagination guard rails
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# Seeding (10000 employees as per assessment specification)
app.seed.employee-count=${APP_SEED_EMPLOYEE_COUNT:10000}
