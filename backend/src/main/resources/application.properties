# Application
spring.application.name=salary-management
server.port=${PORT:8080}

# H2 Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/salarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# The H2 web console is a full read/write window into salary data.
# It stays off unless the dev profile explicitly turns it on.
spring.h2.console.enabled=false
app.security.h2-console-exposed=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
# Supply JWT_SECRET via environment in any shared environment. The fallback below is a
# development-only value and the app refuses to start with it under the prod profile.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-outside-local-development-2024}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Pagination guard rails: caps how much an caller can request in one page.
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# Seeding
# Reduced default from 10,000 to 500 for fast cloud container boot (prevents OOM / startup timeout on Render)
app.seed.employee-count=${APP_SEED_EMPLOYEE_COUNT:500}
