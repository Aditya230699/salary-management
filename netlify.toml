[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/salary-management-frontend/browser"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_SKIP_ANGEL_RUNTIME = "true"
  DISABLE_ANGULAR_PLUGIN = "true"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
