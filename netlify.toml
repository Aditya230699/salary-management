[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/salary-management-frontend/browser"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_SKIP_ANGEL_RUNTIME = "true"
  DISABLE_ANGULAR_PLUGIN = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
